name: Checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/audit-public.py
      - run: python -m unittest discover -s tests -v
      - name: Scan all Git history with verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scan_dir="$(mktemp -d)"
          cd "$scan_dir"
          release="https://github.com/gitleaks/gitleaks/releases/download/v8.30.1"
          curl -fsSLO "$release/gitleaks_8.30.1_linux_x64.tar.gz"
          curl -fsSLO "$release/gitleaks_8.30.1_checksums.txt"
          grep 'gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz
          ./gitleaks git --redact --no-banner "$GITHUB_WORKSPACE"
      - name: Browser tour
        run: |
          pip install -r tests/requirements.txt
          python -m playwright install --with-deps chromium
          python tests/check_demo.py
      - run: node --check tauri/web/app.js && node --check tauri/web/demo.js
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: audio-engine/go.mod
          cache-dependency-path: audio-engine/go.sum
      - name: Native checks
        shell: pwsh
        run: |
          dotnet run --project windows/JarvisHud.HomelabChecks -- examples/demo-snapshot.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project windows/JarvisHud.AudioChecks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reproduce synthetic fixture
        shell: pwsh
        run: |
          ./tools/Build-Demo.ps1
          git diff --exit-code -- tauri/web/demo-data.js docs/tour
      - name: Build Windows application
        shell: pwsh
        run: |
          rustup update stable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./tauri/Build-Obelisk.ps1
